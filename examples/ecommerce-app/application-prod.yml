spring:
  datasource:
    url: jdbc:postgresql://prod-db.internal:5432/ecommerce
    username: prod_user
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cache:
    type: redis
  data:
    redis:
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.example.ecommerce: INFO

feature:
  async-order-processing:
    enabled: true
  new-checkout-flow:
    enabled: false
