spring:
  application:
    name: ecommerce-app
  datasource:
    url: jdbc:postgresql://db:5432/ecommerce
    username: app_user
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
  data:
    redis:
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    com.example.ecommerce: INFO

feature:
  async-order-processing:
    enabled: true
  new-checkout-flow:
    enabled: false
  inventory-sync:
    enabled: true
